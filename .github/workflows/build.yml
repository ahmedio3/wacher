name: Build Debug APK
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: gradle assembleDebug

      - name: Upload APK as Release Asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_id }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "Build ${{ github.run_id }}" \
            --notes "Debug APK from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" || \
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
